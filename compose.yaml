services:
  frontend:
    build:
      context: .
      dockerfile: front-end/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"

  prometheus:
    image: prom/prometheus:v3.7.3
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  communication:
    build: ./micro-services/communication
    environment:
      SERVICE_NAME: communication
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  company-jobs:
    build: ./micro-services/company-jobs
    env_file:
      - ./.env
    environment:
      SERVICE_NAME: company-jobs
      PORT: 3000
      DATABASE_URL: "postgresql://${COMPANY_DB_USER:-khdima_jobs}:${COMPANY_DB_PASSWORD:?Set COMPANY_DB_PASSWORD}@khdimalinkdb:5432/${COMPANY_DB:-khdimalink_company_jobs}"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm start && npm run seed"
    depends_on:
      khdimalinkdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  hiring:
    build: ./micro-services/hiring
    environment:
      SERVICE_NAME: hiring
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity:
    build: ./micro-services/identity
    environment:
      SERVICE_NAME: identity
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification:
    build: ./micro-services/notification
    environment:
      SERVICE_NAME: notification
      PORT: 3000
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    ports:
      - "127.0.0.1:9115:9115"

  telegraf:
    image: telegraf:1.40.3
    user: "999:999"
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hireflow}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:?Missing monitoring password}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Missing Redis password}
    volumes:
      - ./monitoring/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "127.0.0.1:9273:9273"

  khdimalinkdb:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hireflow}

      COMPANY_DB_USER: ${COMPANY_DB_USER:-khdima_jobs}
      COMPANY_DB_PASSWORD: ${COMPANY_DB_PASSWORD:?Set COMPANY_DB_PASSWORD}
      COMPANY_DB: ${COMPANY_DB:-khdimalink_company_jobs}

      COMMUNICATION_DB_USER: ${COMMUNICATION_DB_USER:-communication}
      COMMUNICATION_DB_PASSWORD: ${COMMUNICATION_DB_PASSWORD:?Set COMMUNICATION_DB_PASSWORD}
      COMMUNICATION_DB: ${COMMUNICATION_DB:-khdimalink_communication}

      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD:?Set POSTGRES_MONITOR_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/10-company-db.sh:/docker-entrypoint-initdb.d/10-company-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: khdimalinkdb
    depends_on:
      khdimalinkdb:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana/provisioning/dashboards/hireflow.yml:/etc/grafana/provisioning/dashboards/hireflow.yml:ro
      - ./monitoring/grafana/dashboards-classic:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus

  postgres-backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: khdimalinkdb
      PGUSER: ${POSTGRES_USER:-hireflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./docker/backups/backup-postgres.sh:/scripts/backup-postgres.sh:ro
      - ./backups/postgres:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /scripts/backup-postgres.sh ||
            echo "[POSTGRES BACKUP] Backup failed"
          sleep 86400
        done
    depends_on:
      khdimalinkdb:
        condition: service_healthy

  redis-backup:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - ./docker/backups/backup-redis.sh:/scripts/backup-redis.sh:ro
      - ./backups/redis:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /scripts/backup-redis.sh ||
            echo "[REDIS BACKUP] Backup failed"
          sleep 86400
        done
    depends_on:
      redis:
        condition: service_healthy

  status-page:
    image: ghcr.io/twin/gatus:v5.38.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:8080"
    volumes:
      - ./monitoring/status-page/config.yaml:/config/config.yaml:ro
      - status_page_data:/data

volumes:
  prometheus_data:
  postgres_data:
  redis_data:
  grafana_data:
  status_page_data:
