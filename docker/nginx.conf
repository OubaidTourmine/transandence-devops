upstream communication_backend {
    zone communication_backend 64k;
    resolver 127.0.0.11 ipv6=off;
    server communication:3000 resolve;
}

upstream company-jobs_backend {
    zone company-jobs_backend 64k;
    resolver 127.0.0.11 ipv6=off;
    server company-jobs:3000 resolve;
}

upstream hiring_backend {
    zone hiring_backend 64k;
    resolver 127.0.0.11 ipv6=off;
    server hiring:3000 resolve;
}

upstream identity_backend {
    zone identity_backend 64k;
    resolver 127.0.0.11 ipv6=off;
    server identity:3000 resolve;
}

upstream notification_backend {
    zone notification_backend 64k;
    resolver 127.0.0.11 ipv6=off;
    server notification:3000 resolve;
}



server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /micro-services/communication/ {
        proxy_pass http://communication_backend/;
    }

    location /micro-services/company-jobs/ {
        proxy_pass http://company-jobs_backend/;
    }

    location /micro-services/hiring/ {
        proxy_pass http://hiring_backend/;
    }

    location /micro-services/identity/ {
        proxy_pass http://identity_backend/;
    }

    location /micro-services/notification/ {
        proxy_pass http://notification_backend/;
    }
}
