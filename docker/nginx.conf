server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /micro-services/communication/ {
        proxy_pass http://communication:3000/;
    }

    location /micro-services/company-jobs/ {
        proxy_pass http://company-jobs:3000/;
    }

    location /micro-services/hiring/ {
        proxy_pass http://hiring:3000/;
    }

    location /micro-services/identity/ {
        proxy_pass http://identity:3000/;
    }

    location /micro-services/notification/ {
        proxy_pass http://notification:3000/;
    }
}
