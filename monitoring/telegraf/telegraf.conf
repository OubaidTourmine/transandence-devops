[agent]
  interval = "15s"
  flush_interval = "15s"

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"

[[inputs.mem]]

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

# Prometheus metrics endpoint
[[outputs.prometheus_client]]
  listen = ":9273"
