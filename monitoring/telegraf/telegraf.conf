[agent]
  interval = "15s"
  flush_interval = "15s"

[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"

[[inputs.mem]]

[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.postgresql]]
  address = "host=khdimalinkdb port=5432 user=telegraf_monitor password=${POSTGRES_MONITOR_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
  outputaddress = "khdimalinkdb"
  databases = ["${POSTGRES_DB}"]

[[inputs.redis]]
  servers = ["tcp://redis:6379"]
  password = "${REDIS_PASSWORD}"

[[outputs.prometheus_client]]
  listen = ":9273"
